[package]
name = "cartun"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.40"
crossterm = "0.29.0"

[dependencies.ratatui]
version = "0.29.0"
features = ["all-widgets", "palette"]

[dependencies.clap]
version = "4.5.36"
features = [ "derive" ]

[package.metadata.scripts]
run = "cargo run"
check = "cargo check"
build = "cargo build"
release = "cargo build --release"